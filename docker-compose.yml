services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./kanban.db
      SECRET_KEY: change-me-in-production
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
